<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خلاوة | رحلة البحث عن النجوم الضائعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161210; --bg-soft:#1d1815; --card:#221c18; --card-hover:#2a231e;
    --gold:#d4a94f; --gold-bright:#e8c579; --text:#f2ece3; --text-dim:#a89a8a;
    --text-faint:#75695c; --border:#332c25; --radius:16px; --danger:#c96b5f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;line-height:1.6;}
  h1,h2,h3,.logo{font-family:'Amiri','Tajawal',serif;}
  a{color:inherit;text-decoration:none;}
  img{display:block;width:100%;height:100%;object-fit:cover;}
  button{cursor:pointer;font-family:inherit;}

  header{position:sticky;top:0;z-index:50;background:rgba(22,18,16,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;max-width:1280px;margin:0 auto;}
  .logo{font-size:26px;font-weight:700;color:var(--gold-bright);letter-spacing:1px;cursor:pointer;}
  nav ul{display:flex;gap:34px;list-style:none;}
  nav a{font-size:15px;color:var(--text-dim);transition:color .2s;cursor:pointer;}
  nav a:hover,nav a.active{color:var(--gold-bright);}
  .header-right{display:flex;align-items:center;gap:20px;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:9px 16px;width:220px;position:relative;}
  .search-box input{background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;width:100%;}
  .search-box input::placeholder{color:var(--text-faint);}
  .search-clear{cursor:pointer;color:var(--text-faint);font-size:13px;display:none;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);color:var(--text-dim);}
  .login-link{font-size:14px;color:var(--text-dim);white-space:nowrap;background:none;border:none;font-family:inherit;}
  .login-link:hover{color:var(--gold-bright);}
  .avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);}
  @media(max-width:900px){nav{display:none;} .search-box{display:none;}}

  .hero{position:relative;margin:24px 32px 0;border-radius:24px;overflow:hidden;height:70vh;min-height:440px;max-height:620px;}
  .hero img{position:absolute;inset:0;filter:brightness(.62) saturate(1.05);}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,18,16,.92) 8%,rgba(22,18,16,.35) 55%,transparent 85%);}
  .hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:640px;padding:0 56px;}
  .hero-content h1{font-size:44px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:18px;}
  .hero-content p{color:var(--text-dim);font-size:16px;margin-bottom:30px;max-width:480px;}
  .btn-gold{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1512;font-weight:700;font-size:15px;padding:13px 30px;border-radius:999px;width:fit-content;box-shadow:0 8px 24px -6px rgba(212,169,79,.5);border:none;transition:transform .2s;}
  .btn-gold:hover{transform:translateY(-2px);}
  .hero-dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;}
  .hero-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);}
  .hero-dots span.active{background:var(--gold-bright);width:22px;border-radius:4px;}

  section{padding:56px 32px 0;}
  .section-title{font-size:26px;font-weight:700;color:var(--text);margin-bottom:26px;display:flex;align-items:center;gap:10px;}
  .section-title::before{content:"";width:5px;height:22px;background:var(--gold);border-radius:3px;}

  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .story-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .25s,border-color .25s;cursor:pointer;}
  .story-card:hover{transform:translateY(-4px);border-color:var(--gold);}
  .story-card .thumb{height:190px;position:relative;overflow:hidden;}
  .story-card .thumb .tag{position:absolute;top:12px;right:12px;background:rgba(22,18,16,.85);color:var(--gold-bright);font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--gold);}
  .story-card .body{padding:18px 20px 20px;}
  .story-card h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.5;}
  .story-card .excerpt{font-size:13px;color:var(--text-faint);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .meta-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-faint);}

  .recent-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .article-row{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .25s;cursor:pointer;}
  .article-row:hover{border-color:var(--gold);}
  .article-row .thumb{width:130px;min-width:130px;}
  .article-row .body{padding:14px 16px 14px 0;display:flex;flex-direction:column;justify-content:center;}
  .article-row .eyebrow{font-size:11px;color:var(--gold-bright);font-weight:700;margin-bottom:6px;}
  .article-row h3{font-size:15px;font-weight:700;line-height:1.5;margin-bottom:8px;}
  .article-row .author{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}

  .scroll-row{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .scroll-row::-webkit-scrollbar{display:none;}
  .trend-card{min-width:220px;flex:1 0 220px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s;}
  .trend-card:hover{transform:translateY(-4px);border-color:var(--gold);}
  .trend-card .thumb{height:150px;position:relative;}
  .trend-card .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;color:#1a1512;background:var(--gold-bright);}
  .trend-card .body{padding:14px 16px;}
  .trend-card h3{font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.5;}
  .trend-card .meta{font-size:11px;color:var(--text-faint);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .video-card{position:relative;border-radius:var(--radius);overflow:hidden;height:220px;cursor:pointer;}
  .video-card img{filter:brightness(.65);}
  .play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(212,169,79,.9);display:flex;align-items:center;justify-content:center;color:#1a1512;}
  .duration-tag{position:absolute;bottom:12px;left:12px;background:rgba(22,18,16,.85);font-size:12px;padding:4px 10px;border-radius:6px;color:var(--gold-bright);}
  .video-caption{position:absolute;bottom:14px;right:16px;text-align:right;}
  .video-caption h4{font-size:14px;font-weight:700;color:var(--text);}
  .video-caption span{font-size:11px;color:var(--text-dim);}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .gallery-item{position:relative;border-radius:12px;overflow:hidden;height:140px;cursor:pointer;}

  .no-results{color:var(--text-faint);font-size:14px;padding:10px 0;grid-column:1/-1;}

  footer{margin-top:70px;border-top:1px solid var(--border);padding:40px 32px;}
  .footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px;}
  .footer-links{display:flex;gap:24px;font-size:13px;color:var(--text-faint);flex-wrap:wrap;}
  .social{display:flex;gap:14px;}
  .social a{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .subscribe{display:flex;}
  .subscribe input{background:var(--card);border:1px solid var(--border);border-radius:999px 0 0 999px;padding:10px 16px;color:var(--text);outline:none;font-family:inherit;width:200px;border-left:none;}
  .subscribe button{background:var(--gold);color:#1a1512;font-weight:700;border:none;padding:10px 22px;border-radius:0 999px 999px 0;}

  @media(max-width:760px){
    .grid-3,.grid-2,.recent-grid{grid-template-columns:1fr;}
    .gallery-grid{grid-template-columns:repeat(2,1fr);}
    .hero-content h1{font-size:30px;}
    .hero-content{padding:0 28px;}
    section{padding:40px 18px 0;}
    .hero{margin:16px 12px 0;}
    .header-inner{padding:14px 18px;}
  }

  /* ---- Login ---- */
  #view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;text-align:center;}
  .login-card .logo{font-size:28px;margin-bottom:6px;display:block;}
  .login-card p{color:var(--text-faint);font-size:13px;margin-bottom:26px;}
  .field{text-align:right;margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .field input,.field textarea{width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);outline:none;font-family:inherit;font-size:14px;}
  .field input:focus,.field textarea:focus{border-color:var(--gold);}
  .field textarea{resize:vertical;min-height:70px;}
  .login-card .btn-gold{width:100%;justify-content:center;margin-top:8px;}
  .login-error{color:var(--danger);font-size:13px;margin-top:12px;display:none;}
  .back-link{display:block;margin-top:20px;font-size:13px;color:var(--text-faint);}
  .back-link:hover{color:var(--gold-bright);}

  /* ---- Admin ---- */
  #view-admin{min-height:100vh;}
  .admin-header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border);}
  .admin-header .logo{font-size:22px;}
  .admin-header .badge-admin{font-size:12px;color:var(--gold-bright);border:1px solid var(--gold);padding:3px 10px;border-radius:999px;margin-right:10px;}
  .logout-btn{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:9px 18px;border-radius:999px;font-size:13px;}
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}
  .admin-body{display:flex;max-width:1280px;margin:0 auto;padding:28px 32px;gap:28px;align-items:flex-start;}
  .admin-tabs{display:flex;flex-direction:column;gap:8px;min-width:190px;}
  .admin-tab{text-align:right;background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:12px 16px;border-radius:12px;font-size:14px;}
  .admin-tab.active{border-color:var(--gold);color:var(--gold-bright);background:var(--card-hover);}
  .admin-panel{flex:1;min-width:0;}
  .admin-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:24px;}
  .admin-form h3{font-size:16px;margin-bottom:16px;color:var(--gold-bright);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .form-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn-secondary{background:var(--bg-soft);border:1px solid var(--border);color:var(--text-dim);padding:11px 22px;border-radius:999px;font-size:13px;}
  .item-list{display:flex;flex-direction:column;gap:12px;}
  .item-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;}
  .item-row .thumb-sm{width:56px;height:56px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg-soft);}
  .item-row .info{flex:1;min-width:0;}
  .item-row .info h4{font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-row .info span{font-size:12px;color:var(--text-faint);}
  .item-row .actions{display:flex;gap:8px;}
  .icon-action{width:32px;height:32px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text-dim);font-size:13px;display:flex;align-items:center;justify-content:center;}
  .icon-action.edit:hover{border-color:var(--gold);color:var(--gold-bright);}
  .icon-action.del:hover{border-color:var(--danger);color:var(--danger);}
  .empty-note{color:var(--text-faint);font-size:13px;padding:14px 0;}
  .file-row{display:flex;gap:8px;align-items:center;}
  .file-row input[type=file]{flex:none;font-size:12px;color:var(--text-faint);max-width:130px;}
  .settings-msg{font-size:13px;margin-top:12px;}
  @media(max-width:760px){.admin-body{flex-direction:column;} .form-grid{grid-template-columns:1fr;}}

  /* ---- Detail view ---- */
  #view-detail{min-height:100vh;}
  .detail-hero{position:relative;height:340px;margin:24px 32px 0;border-radius:24px;overflow:hidden;}
  .detail-hero img{position:absolute;inset:0;filter:brightness(.55);}
  .detail-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(22,18,16,.95),transparent 60%);}
  .detail-hero-content{position:absolute;bottom:24px;right:32px;left:32px;z-index:2;}
  .detail-hero-content .tag{display:inline-block;background:rgba(22,18,16,.85);color:var(--gold-bright);font-size:12px;padding:5px 14px;border-radius:999px;border:1px solid var(--gold);margin-bottom:14px;}
  .detail-hero-content h1{font-size:32px;}
  .detail-body{max-width:760px;margin:36px auto 0;padding:0 32px 70px;}
  .detail-meta{color:var(--text-faint);font-size:13px;margin-bottom:24px;}
  .detail-content{font-size:16px;color:var(--text-dim);white-space:pre-wrap;}
  .detail-back{display:inline-flex;gap:6px;color:var(--text-faint);font-size:14px;margin:24px 32px 0;}
  .detail-back:hover{color:var(--gold-bright);}

  /* ---- Heart / share / comments / account ---- */
  .heart-btn{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:50%;background:rgba(22,18,16,.75);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;}
  .heart-btn.active{color:#e8746b;border-color:#e8746b;background:rgba(232,116,107,.15);}
  .detail-heart{position:static;flex:none;}
  .share-row{display:flex;gap:10px;margin:26px 0 10px;}
  .share-row a,.share-row button{text-decoration:none;}
  .comments-section{margin-top:20px;}
  .comment-form{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;}
  .comment-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .comment-item b{color:var(--gold-bright);font-size:14px;}
  .comment-date{font-size:11px;color:var(--text-faint);margin-right:8px;}
  .comment-item p{font-size:14px;color:var(--text-dim);margin-top:6px;}
  .account-name-btn{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:14px;}
  .avatar-initial{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#1a1512;font-weight:700;font-size:15px;}
  .login-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .login-tabs button{flex:1;padding:9px;border-radius:999px;font-size:13px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text-dim);}
  .login-tabs button.active{background:var(--gold);color:#1a1512;border-color:var(--gold);font-weight:700;}

  /* ---- Lightbox ---- */
  #lightbox{position:fixed;inset:0;background:rgba(10,8,6,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:30px;}
  #lightbox img,#lightbox video,#lightbox iframe{max-width:90vw;max-height:85vh;border-radius:12px;display:block;}
  #lightbox iframe{width:80vw;height:70vh;border:none;}
  .lightbox-close{position:absolute;top:24px;left:32px;color:var(--gold-bright);font-size:26px;background:none;border:none;}
</style>
</head>
<body>

<!-- ===================== PUBLIC VIEW ===================== -->
<div id="view-public">
<header>
  <div class="header-inner">
    <div class="logo" id="site-logo" onclick="showView('public')">خلاوة</div>
    <nav><ul id="nav-list"></ul></nav>
    <div class="header-right">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="ابحث..." oninput="onSearch()">
        <span class="search-clear" id="search-clear" onclick="clearSearch()">✕</span>
      </div>
      <span class="icon-btn">🔔</span>
      <div id="account-area"></div>
    </div>
  </div>
</header>

<div class="hero">
  <img id="hero-image" src="" alt="">
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <p id="hero-subtitle"></p>
    <a href="#" class="btn-gold" id="hero-btn"></a>
  </div>
  <div class="hero-dots"><span class="active"></span><span></span><span></span></div>
</div>

<section id="section-stories">
  <h2 class="section-title">قصص مميزة</h2>
  <div class="grid-3" id="stories-grid"></div>
</section>

<section id="section-articles">
  <h2 class="section-title">مقالات حديثة</h2>
  <div class="recent-grid" id="articles-grid"></div>
</section>

<section>
  <h2 class="section-title">الأكثر تفاعلاً على الأسبوع</h2>
  <div class="scroll-row" id="trending-row"></div>
</section>

<section>
  <h2 class="section-title">قصصات الفيديو</h2>
  <div class="grid-2" id="videos-grid"></div>
</section>

<section>
  <h2 class="section-title">معرض الفنون البصرية</h2>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<footer>
  <div class="footer-inner">
    <div class="social" id="footer-social"></div>
    <div class="footer-links" id="footer-links"></div>
    <div>
      <div style="font-size:13px;color:var(--text-faint);margin-bottom:8px;">اشتراك النشرة البريدية</div>
      <div class="subscribe"><button>اشترك الآن</button><input type="email" placeholder="بريدك الإلكتروني"></div>
    </div>
  </div>
</footer>
</div>

<!-- ===================== DETAIL VIEW ===================== -->
<div id="view-detail" style="display:none;">
  <a class="detail-back" href="#" onclick="showView('public');return false;">→ العودة للرئيسية</a>
  <div class="detail-hero">
    <img id="detail-image" src="" alt="">
    <div class="detail-hero-content">
      <span class="tag" id="detail-tag"></span>
      <h1 id="detail-title"></h1>
    </div>
  </div>
  <div class="detail-body">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px;">
      <div class="detail-meta" id="detail-meta"></div>
      <button class="heart-btn detail-heart" id="detail-heart-btn" onclick="toggleFavorite(currentDetail.type, currentDetail.id, event)">♥</button>
    </div>
    <div class="detail-content" id="detail-content"></div>
    <div class="share-row" id="detail-share"></div>
    <div class="comments-section">
      <h3 style="color:var(--gold-bright);margin-bottom:16px;">التعليقات</h3>
      <div class="comment-form">
        <div class="field" id="comment-name-field"><label>الاسم</label><input type="text" id="comment-name"></div>
        <div class="field"><label>تعليقك</label><textarea id="comment-text"></textarea></div>
        <button class="btn-gold" onclick="submitComment(currentDetail.type, currentDetail.id)">إرسال التعليق</button>
      </div>
      <div id="comments-list"></div>
    </div>
  </div>
</div>

<!-- ===================== ACCOUNT VIEW ===================== -->
<div id="view-account" style="display:none;">
  <a class="detail-back" href="#" onclick="showView('public');return false;">→ العودة للرئيسية</a>
  <div class="detail-body">
    <h1 style="margin-bottom:6px;" id="acc-name"></h1>
    <p style="color:var(--text-faint);margin-bottom:28px;" id="acc-email"></p>
    <h3 style="color:var(--gold-bright);margin-bottom:16px;">المفضلة</h3>
    <div class="grid-3" id="acc-favorites"></div>
    <button class="btn-secondary" style="margin-top:30px;" onclick="doReaderLogout()">تسجيل الخروج</button>
  </div>
</div>

<!-- ===================== LOGIN VIEW ===================== -->
<div id="view-login" style="display:none;">
  <div class="login-card" id="login-card-content"></div>
</div>

<!-- ===================== ADMIN VIEW ===================== -->
<div id="view-admin" style="display:none;">
  <div class="admin-header">
    <div style="display:flex;align-items:center;">
      <span class="logo">خلاوة</span>
      <span class="badge-admin">لوحة الأدمن</span>
    </div>

function getData(type){
  const raw = localStorage.getItem('halawa_'+type);
  if(raw) return JSON.parse(raw);
  localStorage.setItem('halawa_'+type, JSON.stringify(DEFAULTS[type]));
  return DEFAULTS[type];
}
function setData(type, val){ localStorage.setItem('halawa_'+type, JSON.stringify(val)); }
function nextId(arr){ return arr.length ? Math.max(...arr.map(i=>i.id))+1 : 1; }

/* ---------------- View switching ---------------- */
let currentDetail = {type:null, id:null};
let loginMode = 'reader-login';

function showView(name){
  ['public','login','admin','detail','account'].forEach(v=>{
    document.getElementById('view-'+v).style.display = (v===name) ? '' : 'none';
  });
  if(name==='public') renderPublic();
  if(name==='admin') switchTab('stories');
  if(name==='login') renderLoginCard(loginMode);
  if(name==='account') renderAccount();
  window.scrollTo(0,0);
}
function openLogin(mode){ loginMode = mode; showView('login'); }

/* ---------------- Admin auth ---------------- */
function doLogin(){
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  if(u===ADMIN_USER && p===getAdminPass()){
    localStorage.setItem('halawa_auth','1');
    showView('admin');
  } else {
    err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    err.style.display = 'block';
  }
}
function doLogout(){ localStorage.removeItem('halawa_auth'); showView('public'); }

/* ---------------- Reader accounts ---------------- */
function getUsers(){ return JSON.parse(localStorage.getItem('halawa_users')||'[]'); }
function saveUsers(arr){ localStorage.setItem('halawa_users', JSON.stringify(arr)); }
function getCurrentUser(){
  const email = localStorage.getItem('halawa_current_user');
  if(!email) return null;
  return getUsers().find(u=>u.email===email) || null;
}
function doRegister(){
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass = document.getElementById('reg-pass').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if(!name || !email || pass.length<4){ err.textContent='الرجاء تعبئة كل الحقول (كلمة مرور 4 خانات على الأقل)'; err.style.display='block'; return; }
  const users = getUsers();
  if(users.some(u=>u.email===email)){ err.textContent='هذا البريد مستخدم بالفعل'; err.style.display='block'; return; }
  users.push({name,email,pass});
  saveUsers(users);
  localStorage.setItem('halawa_current_user', email);
  showView('public');
}
function doReaderLogin(){
  const email = document.getElementById('reader-email').value.trim().toLowerCase();
  const pass = document.getElementById('reader-pass').value;
  const err = document.getElementById('login-error');
  const user = getUsers().find(u=>u.email===email && u.pass===pass);
  if(!user){ err.textContent='البريد أو كلمة المرور غير صحيحة'; err.style.display='block'; return; }
  localStorage.setItem('halawa_current_user', email);
  showView('public');
}
function doReaderLogout(){ localStorage.removeItem('halawa_current_user'); showView('public'); }

function renderLoginCard(mode){
  loginMode = mode;
  const card = document.getElementById('login-card-content');
  if(mode==='admin'){
    card.innerHTML = `
      <span class="logo">خلاوة</span>
      <p>دخول الأدمن فقط لإدارة محتوى الموقع</p>
      <div class="field"><label>اسم المستخدم</label><input type="text" id="login-user" placeholder="admin"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn-gold" onclick="doLogin()">دخول</button>
      <div class="login-error" id="login-error"></div>
      <a class="back-link" href="#" onclick="renderLoginCard('reader-login');return false;">دخول كقارئ بدلاً من ذلك</a>
      <a class="back-link" href="#" onclick="showView('public');return false;">← العودة للموقع</a>`;
  } else if(mode==='reader-register'){
    card.innerHTML = `
      <span class="logo">خلاوة</span>
      <div class="login-tabs">
        <button onclick="renderLoginCard('reader-login')">دخول</button>
        <button class="active">إنشاء حساب</button>
      </div>
      <div class="field"><label>الاسم</label><input type="text" id="reg-name"></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="reg-email"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="reg-pass"></div>
      <button class="btn-gold" onclick="doRegister()">إنشاء الحساب</button>
      <div class="login-error" id="login-error"></div>
      <a class="back-link" href="#" onclick="showView('public');return false;">← العودة للموقع</a>`;
  } else {
    card.innerHTML = `
      <span class="logo">خلاوة</span>
      <div class="login-tabs">
        <button class="active">دخول</button>
        <button onclick="renderLoginCard('reader-register')">إنشاء حساب</button>
      </div>
      <p>سجل الدخول لحفظ المفضلة والتعليق على القصص</p>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="reader-email"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="reader-pass" onkeydown="if(event.key==='Enter')doReaderLogin()"></div>
      <button class="btn-gold" onclick="doReaderLogin()">دخول</button>
      <div class="login-error" id="login-error"></div>
      <a class="back-link" href="#" onclick="renderLoginCard('admin');return false;" style="font-size:11px;opacity:.6;">دخول كأدمن</a>`;
  }
}

/* ---------------- Favorites ---------------- */
function getFavorites(){
  const user = getCurrentUser();
  if(!user) return [];
  const all = JSON.parse(localStorage.getItem('halawa_favorites')||'{}');
  return all[user.email] || [];
}
function setFavorites(list){
  const user = getCurrentUser();
  if(!user) return;
  const all = JSON.parse(localStorage.getItem('halawa_favorites')||'{}');
  all[user.email] = list;
  localStorage.setItem('halawa_favorites', JSON.stringify(all));
}
function isFavorite(type,id){ return getFavorites().some(f=>f.type===type && f.id===id); }
function toggleFavorite(type,id,event){
  if(event) event.stopPropagation();
  if(!getCurrentUser()){ openLogin('reader-login'); return; }
  let list = getFavorites();
  const same = f=>f.type===type && f.id===id;
  list = list.some(same) ? list.filter(f=>!same(f)) : [...list, {type,id}];
  setFavorites(list);
  const q = document.getElementById('search-input') ? document.getElementById('search-input').value : '';
  renderPublic(q);
  if(document.getElementById('view-detail').style.display !== 'none') updateDetailHeart(type,id);
}
function updateDetailHeart(type,id){
  const btn = document.getElementById('detail-heart-btn');
  if(btn) btn.classList.toggle('active', isFavorite(type,id));
}

/* ---------------- Account view ---------------- */
function renderAccountArea(){
  const user = getCurrentUser();
  const el = document.getElementById('account-area');
  if(!el) return;
  if(user){
    el.innerHTML = `<button class="account-name-btn" onclick="showView('account')">${user.name}<span class="avatar-initial">${user.name.charAt(0)}</span></button>`;
  } else {
    el.innerHTML = `<button class="login-link" onclick="openLogin('reader-login')">تسجيل الدخول</button><div class="avatar"><img src="https://picsum.photos/seed/halawa-user/80/80" alt=""></div>`;
  }
}
function renderAccount(){
  const user = getCurrentUser();
  if(!user){ showView('public'); return; }
  document.getElementById('acc-name').textContent = user.name;
  document.getElementById('acc-email').textContent = user.email;
  const favs = getFavorites();
  const stories = getData('stories'), articles = getData('articles');
  const items = favs.map(f=>{
    const src = f.type==='stories' ? stories : articles;
    const item = src.find(i=>i.id===f.id);
    return item ? {...item, _type:f.type} : null;
  }).filter(Boolean);
  document.getElementById('acc-favorites').innerHTML = items.length ? items.map(s=>`
    <div class="story-card" onclick="openDetail('${s._type}',${s.id})">
      <div class="thumb"><img src="${s.image}" alt=""></div>
      <div class="body"><h3>${s.title}</h3></div>
    </div>`).join('') : '<div class="empty-note">لا توجد عناصر في المفضلة بعد</div>';
}

/* ---------------- Share ---------------- */
function renderShareButtons(title){
  const url = encodeURIComponent(location.href);
  const text = encodeURIComponent(title);
  document.getElementById('detail-share').innerHTML = `
    <a class="icon-btn" href="https://wa.me/?text=${text}%20${url}" target="_blank">🟢</a>
    <a class="icon-btn" href="https://twitter.com/intent/tweet?text=${text}&url=${url}" target="_blank">𝕏</a>
    <a class="icon-btn" href="https://t.me/share/url?url=${url}&text=${text}" target="_blank">✈</a>
    <button class="icon-btn" onclick="copyLink()">🔗</button>`;
}
function copyLink(){
  navigator.clipboard.writeText(location.href).then(()=>alert('تم نسخ الرابط')).catch(()=>alert('تعذر نسخ الرابط'));
}

/* ---------------- Comments ---------------- */
function getComments(type,id){
  return JSON.parse(localStorage.getItem('halawa_comments')||'[]').filter(c=>c.itemType===type && c.itemId===id);
}
function renderComments(type,id){
  const list = getComments(type,id);
  document.getElementById('comments-list').innerHTML = list.length ? list.map(c=>`
    <div class="comment-item"><b>${c.name}</b><span class="comment-date">${c.date}</span><p>${c.text}</p></div>`).join('')
    : '<div class="empty-note">لا توجد تعليقات بعد — كن أول من يعلق</div>';
  document.getElementById('comment-name-field').style.display = getCurrentUser() ? 'none' : 'block';
}
function submitComment(type,id){
  const user = getCurrentUser();
  const name = user ? user.name : document.getElementById('comment-name').value.trim();
  const text = document.getElementById('comment-text').value.trim();
  if(!name || !text){ alert('الرجاء كتابة الاسم والتعليق'); return; }
  const all = JSON.parse(localStorage.getItem('halawa_comments')||'[]');
  all.push({id:Date.now(), itemType:type, itemId:id, name, text, date:new Date().toLocaleDateString('ar-EG')});
  localStorage.setItem('halawa_comments', JSON.stringify(all));
  document.getElementById('comment-text').value = '';
  renderComments(type,id);
}

/* ---------------- Detail view ---------------- */
function openDetail(type, id){
  const item = getData(type).find(i=>i.id===id);
  if(!item) return;
  currentDetail = {type, id};
  document.getElementById('detail-image').src = item.image;
  document.getElementById('detail-title').innerHTML = item.title;
  document.getElementById('detail-tag').textContent = item.tag || item.category || '';
  document.getElementById('detail-meta').textContent = item.readTime || (item.author ? 'بقلم '+item.author : '');
  document.getElementById('detail-content').textContent = item.content || item.excerpt || '';
  renderShareButtons(item.title);
  renderComments(type,id);
  showView('detail');
  updateDetailHeart(type,id);
}

/* ---------------- Lightbox ---------------- */
function openLightbox(html){
  document.getElementById('lightbox-content').innerHTML = html;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox(){ document.getElementById('lightbox').style.display = 'none'; document.getElementById('lightbox-content').innerHTML=''; }
function openGalleryLightbox(src){ openLightbox(`<img src="${src}" alt="">`); }
function openVideoLightbox(url){
  if(!url){ alert('لم يتم إضافة رابط فيديو من لوحة الأدمن بعد.'); return; }
  let embed = url;
  if(url.includes('youtube.com') || url.includes('youtu.be')){
    const idMatch = url.match(/(?:v=|youtu\.be\/)([\w-]+)/);
    if(idMatch) embed = `<iframe src="https://www.youtube.com/embed/${idMatch[1]}" allowfullscreen></iframe>`;
    else embed = `<a href="${url}" target="_blank" style="color:#e8c579;">فتح الفيديو</a>`;
    openLightbox(embed); return;
  }
  openLightbox(`<video src="${url}" controls autoplay></video>`);
}

/* ---------------- Search ---------------- */
function onSearch(){
  const q = document.getElementById('search-input').value.trim();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  renderPublic(q);
}
function clearSearch(){
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderPublic();
}

/* ---------------- Public render ---------------- */
function renderPublic(query){
  renderAccountArea();
  const header = getData('header');
  document.getElementById('site-logo').textContent = header.logo;
  document.getElementById('nav-list').innerHTML = header.nav.map((n,i)=>`<li><a class="${i===0?'active':''}">${n}</a></li>`).join('');

  const footer = getData('footer');
  document.getElementById('footer-links').innerHTML = footer.links.map(l=>`<span>${l}</span>`).join('') +
    `<span style="cursor:pointer;" onclick="openLogin('admin')">لوحة التحكم</span>`;
  const socialIcons = {facebook:'f',twitter:'𝕏',instagram:'◎',telegram:'✈'};
  document.getElementById('footer-social').innerHTML = Object.keys(socialIcons).map(k=>
    `<a href="${footer.social[k]||'#'}" target="_blank">${socialIcons[k]}</a>`).join('');

  const hero = getData('hero');
  document.getElementById('hero-title').innerHTML = hero.title;
  document.getElementById('hero-subtitle').textContent = hero.subtitle;
  document.getElementById('hero-image').src = hero.image;
  document.getElementById('hero-btn').textContent = hero.buttonText;

  const q = (query||'').toLowerCase();
  const match = t => !q || (t||'').toLowerCase().includes(q);

  const stories = getData('stories').filter(s=>match(s.title)||match(s.excerpt));
  document.getElementById('stories-grid').innerHTML = stories.length ? stories.map(s=>`
    <div class="story-card" onclick="openDetail('stories',${s.id})">
      <div class="thumb"><img src="${s.image}" alt=""><span class="tag">${s.tag}</span>
        <span class="heart-btn ${isFavorite('stories',s.id)?'active':''}" onclick="toggleFavorite('stories',${s.id},event)">♥</span></div>
      <div class="body">
        <h3>${s.title}</h3>
        <p class="excerpt">${s.excerpt}</p>
        <div class="meta-row"><span>${s.readTime}</span><span>⏱️</span></div>
      </div>
    </div>`).join('') : '<div class="no-results">لا نتائج مطابقة</div>';

  const articles = getData('articles').filter(a=>match(a.title));
  document.getElementById('articles-grid').innerHTML = articles.length ? articles.map(a=>`
    <div class="article-row" onclick="openDetail('articles',${a.id})">
      <div class="thumb" style="position:relative;"><img src="${a.image}" alt="">
        <span class="heart-btn ${isFavorite('articles',a.id)?'active':''}" onclick="toggleFavorite('articles',${a.id},event)">♥</span></div>
      <div class="body">
        <div class="eyebrow">${a.category}</div>
        <h3>${a.title}</h3>
        <div class="author">${a.author} 👤</div>
      </div>
    </div>`).join('') : '<div class="no-results">لا نتائج مطابقة</div>';

  const allStories = getData('stories'), allArticles = getData('articles');
  const trendingSource = [...allStories, ...allArticles].slice(0,4);
  document.getElementById('trending-row').innerHTML = trendingSource.map((t,i)=>`
    <div class="trend-card" onclick="openDetail('${allStories.includes(t)?'stories':'articles'}',${t.id})">
      <div class="thumb"><img src="${t.image}" alt=""><span class="badge">${i===0?'الأكثر قراءة':'أكثر قراءة'}</span></div>
      <div class="body"><h3>${t.title}</h3><div class="meta">${t.readTime || t.category || ''}</div></div>
    </div>`).join('');

  const videos = getData('videos');
  document.getElementById('videos-grid').innerHTML = videos.map(v=>`
    <div class="video-card" onclick="openVideoLightbox('${(v.videoUrl||'').replace(/'/g,"\\'")}')">
      <img src="${v.image}" alt="">
      <span class="play-btn">▶</span>
      <span class="duration-tag">${v.duration}</span>
      <div class="video-caption"><h4>${v.title}</h4><span>${v.category}</span></div>
    </div>`).join('');

  const gallery = getData('gallery');
  document.getElementById('gallery-grid').innerHTML = gallery.map(g=>`
    <div class="gallery-item" onclick="openGalleryLightbox('${g.image}')"><img src="${g.image}" alt=""></div>`).join('');
}

      {key:'content',label:'نص القصة الكامل',type:'textarea',full:true}
    ],
    titleKey:'title', subKey:'tag'
  },
  articles: {
    label:'المقالات',
    fields:[
      {key:'title',label:'العنوان',type:'text',full:true},
      {key:'category',label:'التصنيف',type:'text'},
      {key:'author',label:'الكاتب',type:'text'},
      {key:'image',label:'صورة الغلاف',type:'image',full:true},
      {key:'content',label:'نص المقال الكامل',type:'textarea',full:true}
    ],
    titleKey:'title', subKey:'author'
  },
  videos: {
    label:'مقاطع الفيديو',
    fields:[
      {key:'title',label:'العنوان',type:'text',full:true},

      {key:'duration',label:'المدة (مثال 0:30)',type:'text'},
      {key:'videoUrl',label:'رابط الفيديو (يوتيوب أو mp4)',type:'text'},

  },

let currentTab = 'stories';
let editingId = null;

function switchTab(tab){
  currentTab = tab; editingId = null;
  document.querySelectorAll('.admin-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('admin-list').innerHTML = '';
  if(tab==='hero') return renderHeroForm();
  if(tab==='header') return renderHeaderForm();
  if(tab==='footer') return renderFooterForm();
  if(tab==='settings') return renderSettingsForm();
  renderAdminForm();
  renderAdminList();
}

/* image field helper: text input + file upload -> base64 */
function imageFieldHTML(id, value){
  return `<div class="file-row">
    <input type="text" id="${id}" value="${(value||'').replace(/"/g,'&quot;')}" placeholder="رابط الصورة أو ارفع من جهازك" style="flex:1;">
    <input type="file" accept="image/*" onchange="handleImageUpload(event,'${id}')">
  </div>`;
}
function handleImageUpload(event, targetId){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById(targetId).value = e.target.result; };
  reader.readAsDataURL(file);
}

      <div class="field full"><label>الوصف الفرعي</label><textarea id="h-subtitle">${hero.subtitle}</textarea></div>
      <div class="field full"><label>الصورة</label>${imageFieldHTML('h-image', hero.image)}</div>

    </div>

function renderSettingsForm(){
  document.getElementById('admin-form').innerHTML = `
    <h3>تغيير كلمة مرور الأدمن</h3>
    <div class="form-grid">
      <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="s-current"></div>
      <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="s-new"></div>
      <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="s-confirm"></div>
    </div>
    <div class="form-actions"><button class="btn-gold" style="padding:11px 26px;" onclick="saveSettings()">حفظ كلمة المرور</button></div>
    <div class="settings-msg" id="settings-msg"></div>
    <h3 style="margin-top:28px;">نسخ احتياطي للمحتوى</h3>
    <div class="form-actions">
      <button class="btn-secondary" onclick="exportBackup()">⬇ تصدير نسخة احتياطية (JSON)</button>
      <label class="btn-secondary" style="display:inline-flex;align-items:center;">
        ⬆ استيراد نسخة احتياطية
        <input type="file" accept="application/json" style="display:none;" onchange="importBackup(event)">
      </label>
    </div>
    <div class="settings-msg" id="backup-msg"></div>`;
}
function saveSettings(){
  const cur = document.getElementById('s-current').value;
  const nw = document.getElementById('s-new').value;
  const cf = document.getElementById('s-confirm').value;
  const msg = document.getElementById('settings-msg');
  msg.style.color = 'var(--danger)';
  if(cur !== getAdminPass()){ msg.textContent = 'كلمة المرور الحالية غير صحيحة'; return; }
  if(nw.length < 6){ msg.textContent = 'كلمة المرور الجديدة يجب أن تكون 6 خانات على الأقل'; return; }
  if(nw !== cf){ msg.textContent = 'كلمة المرور الجديدة غير متطابقة'; return; }
  localStorage.setItem('halawa_admin_pass', nw);
  msg.style.color = 'var(--gold-bright)';
  msg.textContent = 'تم تغيير كلمة المرور بنجاح';
}
function exportBackup(){
  const keys = ['stories','articles','videos','gallery','hero','header','footer'];
  const data = {}; keys.forEach(k=>data[k]=getData(k));
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'halawa-backup.json';
  a.click();
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k=>setData(k, data[k]));
      document.getElementById('backup-msg').style.color = 'var(--gold-bright)';
      document.getElementById('backup-msg').textContent = 'تم استيراد النسخة الاحتياطية بنجاح';
    }catch(err){
      document.getElementById('backup-msg').style.color = 'var(--danger)';
      document.getElementById('backup-msg').textContent = 'ملف غير صالح';
    }
  };
  reader.readAsText(file);
}

function renderAdminForm(){
  const cfg = TAB_CONFIG[currentTab];
  const editing = editingId !== null;
  const item = editing ? getData(currentTab).find(i=>i.id===editingId) : null;
  document.getElementById('admin-form').innerHTML = `
    <h3>${editing ? 'تعديل عنصر' : 'إضافة عنصر جديد'} — ${cfg.label}</h3>
    <div class="form-grid">
      ${cfg.fields.map(f=>{
        const val = item ? (item[f.key]||'') : '';
        if(f.type==='image') return `<div class="field ${f.full?'full':''}"><label>${f.label}</label>${imageFieldHTML('f-'+f.key, val)}</div>`;
        if(f.type==='textarea') return `<div class="field ${f.full?'full':''}"><label>${f.label}</label><textarea id="f-${f.key}">${val}</textarea></div>`;
        return `<div class="field ${f.full?'full':''}"><label>${f.label}</label><input type="text" id="f-${f.key}" value="${val.toString().replace(/"/g,'&quot;')}"></div>`;
      }).join('')}
    </div>
    <div class="form-actions">
      <button class="btn-gold" style="padding:11px 26px;" onclick="saveItem()">${editing?'حفظ التعديل':'إضافة'}</button>
      ${editing ? `<button class="btn-secondary" onclick="editingId=null;renderAdminForm();">إلغاء</button>` : ''}
    </div>`;
}

function saveItem(){
  const cfg = TAB_CONFIG[currentTab];
  const arr = getData(currentTab);
  const values = {};
  cfg.fields.forEach(f=>{ values[f.key] = document.getElementById('f-'+f.key).value.trim(); });
  if(editingId !== null){
    const idx = arr.findIndex(i=>i.id===editingId);
    arr[idx] = {...arr[idx], ...values};
  } else {
    values.id = nextId(arr);
    arr.push(values);
  }
  setData(currentTab, arr);
  editingId = null;
  renderAdminForm();
  renderAdminList();
}

function editItem(id){ editingId = id; renderAdminForm(); window.scrollTo(0,0); }

function deleteItem(id){
  if(!confirm('هل تريد حذف هذا العنصر؟')) return;
  const arr = getData(currentTab).filter(i=>i.id!==id);
  setData(currentTab, arr);
  renderAdminList();
}

function renderAdminList(){
  const cfg = TAB_CONFIG[currentTab];
  const arr = getData(currentTab);
  if(!arr.length){
    document.getElementById('admin-list').innerHTML = '<div class="empty-note">لا يوجد عناصر بعد — أضف أول عنصر من الأعلى.</div>';
    return;
  }
  document.getElementById('admin-list').innerHTML = arr.map(item=>`
    <div class="item-row">
      <div class="thumb-sm"><img src="${item.image}" alt=""></div>
      <div class="info">
        <h4>${cfg.titleKey ? (item[cfg.titleKey] || 'بدون عنوان') : ''}</h4>
        ${cfg.subKey ? `<span>${item[cfg.subKey]||''}</span>` : ''}
      </div>
      <div class="actions">
        <button class="icon-action edit" onclick="editItem(${item.id})">✎</button>
        <button class="icon-action del" onclick="deleteItem(${item.id})">✕</button>
      </div>
    </div>`).join('');
}
